services:
  postgres:
    image: postgres:16
    container_name: dagrun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dagrun
    ports:
      - "5432:5432"
    volumes:
      - dagrun_postgres_data:/var/lib/postgresql/data

volumes:
  dagrun_postgres_data:
